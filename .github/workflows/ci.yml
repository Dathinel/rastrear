name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'

jobs:
  build-and-test:
    name: Compilar y pruebas
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Descargar código y submódulos
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Caché del SDK y FFmpeg
        uses: actions/cache@v4
        with:
          path: |
            .entorno/dotnet
            .entorno/ffmpeg
          key: entorno-windows-${{ hashFiles('build/preparar-entorno.ps1') }}

      - name: Preparar entorno
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File build\preparar-entorno.ps1

      - name: Compilar solución (Release -warnaserror)
        shell: pwsh
        run: build\dotnet.cmd build src\Rastrear.slnx -c Release -warnaserror

      - name: Pruebas rápidas
        shell: pwsh
        run: build\dotnet.cmd test src\Rastrear.slnx -c Release --no-build --logger trx --results-directory TestResults

      - name: Resultados de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-pruebas
          path: TestResults/**/*.trx
          if-no-files-found: ignore
